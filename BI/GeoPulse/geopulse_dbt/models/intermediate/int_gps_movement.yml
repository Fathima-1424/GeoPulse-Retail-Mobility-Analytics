
version: 2

models:
  - name: int_gps_movement

    description: >
      Intermediate GPS movement model calculating distance,
      time differences, and estimated speed between consecutive
      GPS pings for each device.

    columns:

      - name: device_id
        description: "Unique device identifier."
        data_tests:
          - not_null
          - not_empty_string

      - name: latitude
        data_tests:
          - not_null

      - name: longitude
        data_tests:
          - not_null

      - name: event_timestamp
        data_tests:
          - not_null

      - name: location
        description: "Current GPS GEOGRAPHY point."
        data_tests:
          - not_null

      - name: loaded_at
        data_tests:
          - not_null
